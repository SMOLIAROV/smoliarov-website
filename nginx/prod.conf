events {}

http {
    proxy_cache_path /var/cache/nginx/pages
        levels=1:2
        keys_zone=pages:10m
        max_size=256m
        inactive=1h
        use_temp_path=off;

    server {
        listen 80;
        listen [::]:80;

        server_name smoliarov.online www.smолiarov.online;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name smoliarov.online www.smoliarov.online;

        ssl_certificate /etc/letsencrypt/live/smoliarov.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smoliarov.online/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /_next/ {
            proxy_pass http://app:3000;
            proxy_cache off;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://app:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_cache pages;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 1h;
            proxy_cache_lock on;

            proxy_cache_bypass
                $arg__rsc
                $http_rsc
                $http_next_router_prefetch
                $http_next_router_state_tree;

            proxy_no_cache
                $arg__rsc
                $http_rsc
                $http_next_router_prefetch
                $http_next_router_state_tree;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header X-Page-Cache $upstream_cache_status always;
        }
    }
}